name: 自动爬虫并发送邮件

on:
  schedule:
    # 在北京时间上午 9:00, 中午 12:00, 晚上 18:00 执行
    # CRON表达式: 分 时 日 月 星期
    # 北京时间 9点 = UTC时间 1点 -> 1
    # 北京时间 12点 = UTC时间 4点 -> 4
    # 北京时间 18点 = UTC时间 10点 -> 10
    - cron: '0 1 * * *'  # 上午 9:00
    - cron: '0 4 * * *'  # 中午 12:00
    - cron: '0 10 * * *' # 晚上 18:00
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行爬虫脚本
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py